<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Premium Neon Violet to Cyan Gradient -->
    <linearGradient id="agent-bond-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#a855f7" /> <!-- Purple -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Cyan -->
    </linearGradient>
    
    <!-- Glow Filter for High-tech Aesthetics -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base for contrast (Optional, but helps in light/dark tabs) -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" fill-opacity="0.9" stroke="url(#agent-bond-grad)" stroke-width="2" />

  <!-- The Investigation/Bond Emblem -->
  <g filter="url(#neon-glow)">
    <!-- Magnifying Glass Lens Frame -->
    <circle cx="28" cy="26" r="14" stroke="url(#agent-bond-grad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Magnifying Glass Handle -->
    <line x1="38" y1="36" x2="49" y2="47" stroke="url(#agent-bond-grad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="42" y1="40" x2="47" y2="45" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <!-- Interconnected Agent Nodes (Bonds) inside the Lens -->
    <!-- Connection Lines -->
    <line x1="22" y1="26" x2="30" y2="19" stroke="url(#agent-bond-grad)" stroke-width="2" opacity="0.8" />
    <line x1="30" y1="19" x2="33" y2="29" stroke="url(#agent-bond-grad)" stroke-width="2" opacity="0.8" />
    <line x1="22" y1="26" x2="33" y2="29" stroke="url(#agent-bond-grad)" stroke-width="2" opacity="0.8" />

    <!-- Central Hub Node -->
    <circle cx="30" cy="19" r="3" fill="#ffffff" />
    
    <!-- Left Agent Node -->
    <circle cx="22" cy="26" r="2.5" fill="#06b6d4" />
    
    <!-- Right Agent Node -->
    <circle cx="33" cy="29" r="2.5" fill="#a855f7" />
  </g>
</svg>