version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: investigator_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  
  prometheus:
    image: prom/prometheus:latest
    container_name: investigator_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml   # Extra host routing definition so docker container can resolve localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: investigator_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped